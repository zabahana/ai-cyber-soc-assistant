[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "soc-assistant"
version = "0.1.0"
description = "Evidence-grounded, human-reviewed security telemetry demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scikit-learn>=1.4,<2", "xgboost>=2,<4", "joblib>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["streamlit>=1.50,<2"]
spark = ["pyspark>=3.5,<5"]
llm = ["openai>=1.50"]
[project.scripts]
soc = "soc_assistant.cli:main"
[tool.setuptools.packages.find]
include = ["soc_assistant*"]
